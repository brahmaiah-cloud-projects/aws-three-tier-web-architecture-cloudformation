AWSTemplateFormatVersion: 2010-09-09

Description: Launch template for Three tier Web architecture

Parameters:

  EC2SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id


Resources:
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
 
        ImageId: ami-xxxxxxx (for practice)
        InstanceType: t3.micro
        SecurityGroupIds: 
          - !Ref EC2SecurityGroupId
        UserData:
          Fn::Base64: |
            #!/bin/bash
            apt update -y
            apt install apache2 -y
            systemctl enable apache2
            systemctl start apache2

            echo "<h1>Hello Mama From Three Tier Web Architecture </h1>"  > /var/www/html/index.html




Outputs:

  LaunchTemplateId:
    Value: !Ref LaunchTemplate




