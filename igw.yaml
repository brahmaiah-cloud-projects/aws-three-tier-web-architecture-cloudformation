AWSTemplateFormatVersion: 2010-09-09

Description: Internet Gateway For Three Tier Web Architecture.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id

Resources:

  MyIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ThreeTierIGW

  MyIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref MyIGW
      VpcId: !Ref VpcId

Outputs:

  IGWId:
    Value: !Ref MyIGW
